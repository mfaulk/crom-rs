[workspace]
resolver = "2"
members = [
    "crates/crom-core",
    "crates/crom-anthropic",
    "crates/crom-tools",
    "crates/crom-session",
    "crates/crom-checkpoint",
    "crates/crom-mcp",
    "crates/crom-tui",
    "crates/crom-cli",
    "crates/crom-auth",
    "crates/crom-provider-openai",
    "crates/crom-provider-gemini",
    "crates/crom-sdk",
    "crates/crom-eval",
]
exclude = [
    "crates/crom-eval/eval",
    "examples/bugfix-demo",
    "examples/policy-demo",
    "examples/checkpoint-demo",
    "examples/mcp-demo",
    "examples/subagent-demo",
    "examples/skills-demo",
    "examples/beta-demo",
    "examples/planning-demo",
    "examples/headless-sdk-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mfaulk/crom-rs"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std", "process", "time", "sync", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
camino = { version = "1", features = ["serde1"] }
similar = "3"
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
bytes = "1"
tempfile = "3"
# Cross-process advisory file locks (flock/LockFile). Pure-Rust, uses
# `rustix` on Unix (already in the tree). MIT OR Apache-2.0.
fs4 = "1"
temp-env = { version = "0.3", features = ["async_closure"] }
sha2 = "0.11"
hex = "0.4"
rand = { version = "0.10", features = ["sys_rng"] }
insta = { version = "1", features = ["json"] }
proptest = "1"

crom-core = { path = "crates/crom-core", version = "0.1.0" }
crom-anthropic = { path = "crates/crom-anthropic", version = "0.1.0" }
crom-tools = { path = "crates/crom-tools", version = "0.1.0" }
crom-session = { path = "crates/crom-session", version = "0.1.0" }
crom-checkpoint = { path = "crates/crom-checkpoint", version = "0.1.0" }
crom-mcp = { path = "crates/crom-mcp", version = "0.1.0" }
crom-auth = { path = "crates/crom-auth", version = "0.1.0" }
crom-provider-openai = { path = "crates/crom-provider-openai", version = "0.1.0" }
crom-provider-gemini = { path = "crates/crom-provider-gemini", version = "0.1.0" }
crom-sdk = { path = "crates/crom-sdk", version = "0.1.0" }
crom-tui = { path = "crates/crom-tui", version = "0.1.0" }
crom-eval = { path = "crates/crom-eval", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
