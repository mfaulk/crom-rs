[workspace]
resolver = "2"
members = [
    "crates/code-agent-core",
    "crates/code-agent-anthropic",
    "crates/code-agent-tools",
    "crates/code-agent-session",
    "crates/code-agent-checkpoint",
    "crates/code-agent-mcp",
    "crates/code-agent-cli",
]
exclude = [
    "examples/bugfix-demo",
    "examples/policy-demo",
    "examples/checkpoint-demo",
    "examples/mcp-demo",
    "examples/subagent-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/mfaulk/code-agent"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std", "process", "time", "sync", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
camino = { version = "1", features = ["serde1"] }
similar = "2"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
bytes = "1"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"

code-agent-core = { path = "crates/code-agent-core", version = "0.1.0" }
code-agent-anthropic = { path = "crates/code-agent-anthropic", version = "0.1.0" }
code-agent-tools = { path = "crates/code-agent-tools", version = "0.1.0" }
code-agent-session = { path = "crates/code-agent-session", version = "0.1.0" }
code-agent-checkpoint = { path = "crates/code-agent-checkpoint", version = "0.1.0" }
code-agent-mcp = { path = "crates/code-agent-mcp", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
