name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  schedule:
    # Weekly run (Mondays 06:00 UTC) so the security/deny audits keep
    # catching newly-published advisories even without new commits.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test:
    name: build / test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary lane: lint + test on stable/ubuntu.
          - name: ubuntu / stable
            os: ubuntu-latest
            toolchain: stable
            lint: true
          # OS coverage on stable.
          - name: macos / stable
            os: macos-latest
            toolchain: stable
            lint: false
          # MSRV lane. Must match `workspace.package.rust-version` in Cargo.toml.
          - name: ubuntu / msrv 1.89.0
            os: ubuntu-latest
            toolchain: 1.89.0
            lint: false
          # Early-warning lane for upcoming compiler changes.
          - name: ubuntu / beta
            os: ubuntu-latest
            toolchain: beta
            lint: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # fmt + clippy only need to run once; guard them to the primary lane.
      - name: Format
        if: matrix.lint
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --locked --workspace --all-targets

  docs:
    name: docs (rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Doc
        run: cargo doc --workspace --no-deps --all-features

  examples-build:
    name: examples / check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Excluded-from-workspace example crates (Cargo.toml `[workspace] exclude`)
        # plus the standalone examples that ship their own Cargo.toml. Each is
        # checked against its own manifest. Verified to `cargo check` against main.
        example:
          - bugfix-demo
          - policy-demo
          - checkpoint-demo
          - mcp-demo
          - subagent-demo
          - skills-demo
          - beta-demo
          - planning-demo
          - headless-sdk-demo
          - tool-search-demo
          - tui-demo
          - guard-support
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Isolate the cache per example so the matrix legs don't thrash a
          # single shared key (default key is OS + job name, identical here).
          key: ${{ matrix.example }}
      - name: Check ${{ matrix.example }}
        # `--workspace` so example sub-crates that aren't the default package
        # (e.g. the fake MCP server in mcp-demo / tool-search-demo) are built.
        # No `--locked`: each example ships its own Cargo.lock that dependabot
        # does not manage, so a workspace dependency bump (which reaches the
        # examples via path deps) legitimately needs to update the example lock.
        # `--locked` would reject that and fail every dependabot cargo PR; the
        # workspace build/test lanes above still run with `--locked`.
        run: cargo check --workspace --manifest-path examples/${{ matrix.example }}/Cargo.toml

  eval:
    name: eval / offline suites (fake + golden providers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: eval
      # Fast, deterministic, offline lane. Never runs live-provider evals:
      # the live lane is gated at runtime by CROM_EVAL_LIVE, which is
      # not set here.
      - name: Eval harness unit + integration tests
        run: cargo test --locked -p crom-eval
      # Model-free task validation. Capability tasks must have hidden
      # verification and a reference that passes it (schema v3, #285).
      # Together with the l1/l2/l3-mini steps below and the l3 job, this
      # covers every shipped suite. rust-serde-edge-case (rust-small,
      # rust-mini) fetches serde from crates.io.
      - name: Validate harness and legacy capability suites
        run: |
          for suite in smoke golden safety security adversarial repair-smoke \
                       repair-mini planning rust-small rust-mini \
                       provider-conformance; do
            cargo run --locked -p crom-cli -- eval validate-suite "$suite"
          done
      # L1 capability corpus (#287): every reference passes public + hidden
      # verification and every unmodified fixture fails it (no_change: passes).
      - name: Validate L1 capability suite
        run: cargo run --locked -p crom-cli -- eval validate-suite l1
      # L2 capability corpus (#288): each task's unmodified fixture must fail
      # public + hidden verification and its oracle patch must pass both (the
      # no_change task must pass as-is). Fixtures are dependency-free crates.
      - name: Validate L2 capability suite
        run: cargo run --locked -p crom-cli -- eval validate-suite l2
      # L3-mini corpus: std-only multi-crate workspaces, so the reference
      # patch must pass and the unmodified fixture must fail fully offline.
      - name: Validate L3-mini capability suite
        run: cargo run --locked -p crom-cli -- eval validate-suite l3-mini
      - name: Eval smoke suite (fake provider)
        run: cargo run --locked -p crom-cli -- eval run --suite smoke --provider fake
      - name: Eval golden suite (golden provider)
        run: cargo run --locked -p crom-cli -- eval run --suite golden --provider golden
      - name: Eval safety suite (fake provider)
        run: cargo run --locked -p crom-cli -- eval run --suite safety --provider fake
      # Leak canary (#286): grader material must be unreachable from the agent
      # workspace; the golden script tries `cat ../task.toml` and Read.
      - name: Eval security suite (golden provider)
        run: cargo run --locked -p crom-cli -- eval run --suite security --provider golden
      # repair-smoke contains a negative task (repair-grep-trap) that must NOT
      # resolve, so the CLI's resolved-gate is relaxed with --allow-failures and
      # the expected per-task outcomes are asserted from the artifacts instead.
      - name: Eval repair-smoke suite (golden provider, repair enabled)
        run: |
          runs=target/crom-eval/repair-smoke
          cargo run --locked -p crom-cli -- eval run --suite repair-smoke \
            --provider golden --repair enabled --allow-failures --runs-dir "$runs"
          run_dir=$(find "$runs" -mindepth 1 -maxdepth 1 -type d -name 'run-*' | sort | tail -n 1)
          jq -e '.resolved == true' "$run_dir/tasks/repair-grep-recover/result.json"
          jq -e '.resolved == false and .repair.same_error_repeated == true' \
            "$run_dir/tasks/repair-grep-trap/result.json"
      # Surface the artifact bundle when an offline suite regresses so failures
      # are debuggable from the CI run.
      - name: Upload eval artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-runs
          path: |
            target/crom-eval/runs
            target/crom-eval/repair-smoke
          if-no-files-found: ignore

  eval-l3:
    name: eval / L3 upstream fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: eval-l3
      # L3 corpus (#289): upstream repos pinned in mfaulk/crom-eval-fixtures.
      # The fixture commit is fetched once (cached by the rev in the task
      # manifests); verification itself builds with dependencies vendored
      # and --offline.
      - name: Fixture cache key
        id: rev
        run: echo "rev=$(grep -h '^rev = ' crates/crom-eval/eval/tasks/l3-*/task.toml | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/crom/eval-fixtures
          key: eval-fixtures-${{ steps.rev.outputs.rev }}
      # Upstream snapshots are not warning-clean on current Rust, so the
      # workflow-level `-D warnings` must not reach their builds. RUSTFLAGS is
      # unset rather than emptied: any value, even "", overrides the
      # per-snapshot `.cargo/config.toml` rustflags.
      - name: Validate L3 capability suite
        env:
          CARGO_BUILD_JOBS: "4"
        run: env -u RUSTFLAGS cargo run --locked -p crom-cli -- eval validate-suite l3

  eval-l4:
    name: eval / L4 real-world issues
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: eval-l4
      # L4 corpus (#296): real upstream issues pinned in
      # mfaulk/crom-eval-fixtures; see docs/eval/real-world-tasks.md.
      - name: Fixture cache key
        id: rev
        run: echo "rev=$(grep -h '^rev = ' crates/crom-eval/eval/tasks/l4-*/task.toml | sort -u | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/crom/eval-fixtures
          key: eval-fixtures-l4-${{ steps.rev.outputs.rev }}
      # Upstream snapshots are not warning-clean; keep `-D warnings` away
      # from their builds (see the L3 job).
      - name: Validate L4 capability suite
        env:
          CARGO_BUILD_JOBS: "4"
        run: env -u RUSTFLAGS cargo run --locked -p crom-cli -- eval validate-suite l4

  coverage:
    name: coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-gating: a coverage-tooling or flaky-test failure must never block a
    # PR. `fail_ci_if_error: false` only stops a Codecov *upload* error from
    # failing; `continue-on-error` makes the whole job (incl. the collection
    # step) non-blocking, so coverage stays purely informational (#21).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov, cargo-nextest
      # Non-gating: measure + track coverage. cargo-llvm-cov drives nextest,
      # matching the test lane's runner, and emits lcov for Codecov.
      - name: Collect coverage
        run: cargo llvm-cov nextest --locked --workspace --all-targets --all-features --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  sandbox:
    name: security / OS sandbox (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A host that cannot enforce the sandbox fails the lane instead of skipping.
      CROM_REQUIRE_SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sandbox
      # Includes the #[ignore]d fork-bomb/fork-loop/memory containment tests,
      # run inside a TasksMax/MemoryMax cgroup scope (#253 incident).
      - name: Sandbox enforcement tests (P1-P7)
        run: scripts/sandbox-tests.sh
      - name: Eval golden suite with agent tools sandboxed
        run: cargo run --locked -p crom-cli -- eval run --suite golden --provider golden --sandbox required
      - name: Eval security suite with agent tools sandboxed
        run: cargo run --locked -p crom-cli -- eval run --suite security --provider golden --sandbox required
      # #292: scripted attacks with the sandbox required (executed must be 0)
      # and off (the effect oracle must see executed > 0). All canaries are
      # synthetic and live in temp dirs.
      - name: Adversarial security suite (scripted, effect-scored)
        run: cargo test --locked -p crom-eval --test adversarial --test repo_config_escalation -- --nocapture
      - name: Upload adversarial report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: adversarial-report
          path: target/tmp/adversarial/report.json
          if-no-files-found: ignore

  guard-boundary:
    name: security / guard dependency boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # ADR 0002: crom-guard and crom-guard-server depend on no other crom-* crate.
      - name: Guard depends on no other crom-* crate
        run: scripts/check-guard-deps.sh

  deny:
    name: security / cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check advisories bans sources licenses

  guard-policies:
    name: security / Guard Cedar policies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guard-policies
      # Version must match the cedar-policy pin in ADR 0003. `cargo install`
      # is a no-op when the cached ~/.cargo/bin already has this version.
      - name: Install cedar-policy-cli
        run: cargo install --locked cedar-policy-cli --version 4.15.0
      # ADR 0003 / #346: strict validation of the reference policy set.
      - name: Validate Guard policies (strict)
        run: scripts/validate-guard-policies.sh

  guard-python-client:
    name: guard / python client (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guard-python-client
      # #358: a client that links no Rust or Crom code (runner python3, stdlib only).
      - name: Python client unit tests (JSON-RPC framing, stdlib-only imports)
        working-directory: examples/guard-support/clients/python
        run: python3 -m unittest -v
      - name: Python client against Guard (MILESTONE_18 §14.2 matrix)
        run: examples/guard-support/run-python-client.sh
      - name: Upload Python client report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guard-python-client
          path: target/guard-python-client/
          if-no-files-found: ignore

  guard-adversarial:
    name: guard / adversarial (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # G13, G14, G18 (#360) run from sandboxed agent Bash and as user
      # `nobody`; neither may turn into a skip here.
      CROM_REQUIRE_SANDBOX_TESTS: "1"
      CROM_REQUIRE_SEPARATE_UID_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guard-adversarial
      # #361: G1–G12, G15, G16 in process, through the reference server,
      # through the stdlib Python client (runner python3), and without
      # Guard; scored on the business ledger. #360: G13, G14, G18 from agent
      # Bash (sandbox required, required + network, off, separate uid) and
      # G17 against `crom-guard check`.
      - name: Guard adversarial scenarios (ledger-scored)
        run: cargo test --locked -p crom-guard-testkit --test guard_adversarial -- --nocapture
      - name: Upload Guard scenario report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guard-scenarios-report
          path: target/tmp/guard-scenarios/report.json
          if-no-files-found: ignore

  guard-isolation:
    name: guard / isolation (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Neither a missing sandbox nor missing passwordless sudo may turn
      # into a skip here (docs/guard/deployment.md).
      CROM_REQUIRE_SANDBOX_TESTS: "1"
      CROM_REQUIRE_SEPARATE_UID_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guard-isolation
      # #360: G13/G14/G16/G18 from agent Bash with the sandbox required
      # (no unmediated effect) and off (each probe fires), and the same
      # attacks as a separate uid (`nobody`, via the runner's sudo).
      - name: Alternate-path bypass tests
        run: cargo test --locked -p crom-guard-testkit --test bypass -- --nocapture
      - name: Preflight (crom-guard check) tests
        run: |
          cargo test --locked -p crom-guard-server --lib check::
          cargo test --locked -p crom-guard-server --test cli check_

  guard-reference-app:
    name: guard / reference app (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # One target dir for the example crate and the crom-guard-support build it triggers.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guard-reference-app
      # #362: no lockfile flag, as in `examples / check` (the example ships its own Cargo.lock).
      - name: Reference app unit tests
        run: cargo test --manifest-path examples/guard-support/Cargo.toml
      # Scripted Crom agent, offline: `crom-guard check` must pass before Guard
      # starts, the MILESTONE_18 §14.2 matrix must match
      # examples/guard-support/snapshots/scripted-matrix.txt and every evidence check must pass.
      - name: Scripted demo (MILESTONE_18 §14.2 matrix)
        run: |
          cargo run --manifest-path examples/guard-support/Cargo.toml -- --agent scripted
          jq -e '.checks[] | select(.check | startswith("crom-guard check")) | .pass' target/guard-demo/report.json
          ! grep -q '^FAIL' target/guard-demo/guard-check.txt
      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guard-demo
          path: target/guard-demo/
          if-no-files-found: ignore

  workflows:
    name: lint / workflows + spend-cap gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Live eval lanes (#295) must fail closed without a valid spend cap.
      - name: Spend-cap gate dry run
        run: .github/scripts/test-check-spend-cap.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
