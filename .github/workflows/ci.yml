name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  schedule:
    # Weekly run (Mondays 06:00 UTC) so the security/deny audits keep
    # catching newly-published advisories even without new commits.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test:
    name: build / test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary lane: lint + test on stable/ubuntu.
          - name: ubuntu / stable
            os: ubuntu-latest
            toolchain: stable
            lint: true
          # OS coverage on stable.
          - name: macos / stable
            os: macos-latest
            toolchain: stable
            lint: false
          # MSRV lane. Must match `workspace.package.rust-version` in Cargo.toml.
          - name: ubuntu / msrv 1.88.0
            os: ubuntu-latest
            toolchain: 1.88.0
            lint: false
          # Early-warning lane for upcoming compiler changes.
          - name: ubuntu / beta
            os: ubuntu-latest
            toolchain: beta
            lint: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # fmt + clippy only need to run once; guard them to the primary lane.
      - name: Format
        if: matrix.lint
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --locked --workspace --all-targets

  docs:
    name: docs (rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc
        run: cargo doc --workspace --no-deps --all-features

  examples-build:
    name: examples / check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Excluded-from-workspace example crates (Cargo.toml `[workspace] exclude`)
        # plus the standalone examples that ship their own Cargo.toml. Each is
        # checked against its own manifest. Verified to `cargo check` against main.
        example:
          - bugfix-demo
          - policy-demo
          - checkpoint-demo
          - mcp-demo
          - subagent-demo
          - skills-demo
          - beta-demo
          - planning-demo
          - headless-sdk-demo
          - tool-search-demo
          - tui-demo
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Isolate the cache per example so the matrix legs don't thrash a
          # single shared key (default key is OS + job name, identical here).
          key: ${{ matrix.example }}
      - name: Check ${{ matrix.example }}
        # `--workspace` so example sub-crates that aren't the default package
        # (e.g. the fake MCP server in mcp-demo / tool-search-demo) are built.
        # No `--locked`: each example ships its own Cargo.lock that dependabot
        # does not manage, so a workspace dependency bump (which reaches the
        # examples via path deps) legitimately needs to update the example lock.
        # `--locked` would reject that and fail every dependabot cargo PR; the
        # workspace build/test lanes above still run with `--locked`.
        run: cargo check --workspace --manifest-path examples/${{ matrix.example }}/Cargo.toml

  eval:
    name: eval / smoke (fake provider)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: eval
      # Fast, deterministic, offline lane. Never runs live-provider evals:
      # the live lane is gated at runtime by CODE_AGENT_EVAL_LIVE, which is
      # not set here.
      - name: Eval harness unit + integration tests
        run: cargo test --locked -p code-agent-eval
      - name: Eval smoke suite (fake provider)
        run: cargo run --locked -p code-agent-cli -- eval run --suite smoke --provider fake
      # Surface the artifact bundle when the smoke suite regresses so failures
      # are debuggable from the CI run.
      - name: Upload eval artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: eval-runs
          path: target/code-agent-eval/runs
          if-no-files-found: ignore

  coverage:
    name: coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-gating: a coverage-tooling or flaky-test failure must never block a
    # PR. `fail_ci_if_error: false` only stops a Codecov *upload* error from
    # failing; `continue-on-error` makes the whole job (incl. the collection
    # step) non-blocking, so coverage stays purely informational (#21).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov, cargo-nextest
      # Non-gating: measure + track coverage. cargo-llvm-cov drives nextest,
      # matching the test lane's runner, and emits lcov for Codecov.
      - name: Collect coverage
        run: cargo llvm-cov nextest --locked --workspace --all-targets --all-features --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  deny:
    name: security / cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses
