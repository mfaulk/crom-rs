name: Guard (live)

# MILESTONE_18 §13.4 E3 (model-generated attacks) and E4b (live provider
# independence), #363. Manual only: never runs on push/PR. Each provider runs
# the reference app (examples/guard-support) with a real model against Guard,
# under a per-run spend cap no larger than GUARD_LIVE_CEILING_USD. Secrets come
# from the `eval-live` environment (required reviewers). A provider whose key
# is missing is skipped with a warning.
on:
  workflow_dispatch:
    inputs:
      max_run_cost_usd:
        description: 'Required. Spend cap per provider run in USD (<= 2)'
        required: true
        type: string
      providers:
        description: 'Space-separated provider profile ids; low-cost first (deepseek, then anthropic, openai, gemini)'
        required: false
        default: 'deepseek'
      model:
        description: 'Model override for every provider (blank = each profile default_model; must be priced)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: guard-live
  cancel-in-progress: false

jobs:
  guard-live:
    name: guard / live (E3, E4b)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: eval-live
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      GUARD_LIVE_CEILING_USD: '2'
      # Inputs reach the shell only through env, never inline interpolation.
      PROVIDERS: ${{ inputs.providers }}
      MODEL: ${{ inputs.model }}
      MAX_RUN_COST_USD: ${{ inputs.max_run_cost_usd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check spend cap
        run: .github/scripts/check-spend-cap.sh "$MAX_RUN_COST_USD" "$GUARD_LIVE_CEILING_USD"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: guard-live
      - name: Reference app with live models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p target/guard-live
          status=0
          for p in $PROVIDERS; do
            case "$p" in
              anthropic) key="$ANTHROPIC_API_KEY" ;;
              openai) key="$OPENAI_API_KEY" ;;
              deepseek) key="$DEEPSEEK_API_KEY" ;;
              gemini) key="$GEMINI_API_KEY" ;;
              *) echo "::error::unknown provider $p"; exit 1 ;;
            esac
            if [ -z "$key" ]; then
              echo "::warning::no API key secret for $p; skipped"
              continue
            fi
            args=(--agent live --provider "$p" --supervisor deny
                  --max-run-cost-usd "$MAX_RUN_COST_USD" --out "target/guard-live/$p")
            if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
            cargo run --manifest-path examples/guard-support/Cargo.toml -- "${args[@]}" || status=1
          done
          exit "$status"
      - name: Scoreboard
        if: always()
        run: |
          reports=()
          for f in target/guard-live/*/report.json; do
            [ -e "$f" ] && reports+=(--guard-report "$f")
          done
          if [ "${#reports[@]}" -gt 0 ]; then
            cargo run --locked -p crom-cli -- eval scoreboard "${reports[@]}" --format md >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guard-live
          path: target/guard-live/
          if-no-files-found: ignore
