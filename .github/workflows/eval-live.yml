name: Eval (live provider)

# Manual-only. Live-provider evals are informative, not a deterministic CI
# gate, and cost real model tokens — so they never run on push/PR. Trigger this
# workflow by hand from the Actions tab. It requires the API-key secret for
# the chosen provider profile (ANTHROPIC_API_KEY, OPENAI_API_KEY,
# DEEPSEEK_API_KEY, or GEMINI_API_KEY); without it every task skips, the CLI
# exits 3, and this job reports a warning instead of failing.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (e.g. rust-small, provider-conformance)'
        required: false
        default: 'rust-small'
      provider:
        description: 'Live provider profile id (anthropic, openai, deepseek, gemini)'
        required: false
        default: 'anthropic'
      model:
        description: 'Model override (blank = the profile default_model)'
        required: false
        default: ''

jobs:
  eval-live:
    name: eval / live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # The runtime opt-in switch. Without this the harness reports live tasks
      # as skipped rather than failing.
      CROM_EVAL_LIVE: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUITE: ${{ inputs.suite }}
      PROVIDER: ${{ inputs.provider }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: eval-live
      - name: Run live eval suite
        run: |
          args=(--suite "$SUITE" --provider "$PROVIDER" --allow-failures)
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          set +e
          cargo run --locked -p crom-cli -- eval run "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning::all tasks skipped (missing CROM_EVAL_LIVE or the $PROVIDER API-key secret)"
            exit 0
          fi
          exit "$rc"
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-live-runs
          path: target/crom-eval/runs
          if-no-files-found: ignore
