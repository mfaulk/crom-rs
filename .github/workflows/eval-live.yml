name: Eval (live smoke)

# Lane 3 (#295). Manual only: never runs on push/PR. Spends real model tokens,
# so it refuses to start without a spend cap no larger than LIVE_SMOKE_CEILING_USD.
# Secrets come from the `eval-live` environment; give it required reviewers so
# every run needs maintainer approval. Without the provider's key every task
# skips, the CLI exits 3, and the job warns instead of failing.
on:
  workflow_dispatch:
    inputs:
      max_run_cost_usd:
        description: 'Required. Run-wide nominal spend cap in USD (<= 5)'
        required: true
        type: string
      suite:
        description: 'Suite to run'
        required: false
        default: 'provider-conformance'
      provider:
        description: 'Live provider profile id (anthropic, openai, deepseek, gemini)'
        required: false
        default: 'deepseek'
      model:
        description: 'Model override (blank = profile default_model; must be priced)'
        required: false
        default: 'deepseek-flash'

permissions:
  contents: read

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  eval-live:
    name: eval / live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: eval-live
    env:
      CARGO_TERM_COLOR: always
      LIVE_SMOKE_CEILING_USD: '5'
      # Inputs reach the shell only through env, never inline interpolation.
      SUITE: ${{ inputs.suite }}
      PROVIDER: ${{ inputs.provider }}
      MODEL: ${{ inputs.model }}
      MAX_RUN_COST_USD: ${{ inputs.max_run_cost_usd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check spend cap
        run: .github/scripts/check-spend-cap.sh "$MAX_RUN_COST_USD" "$LIVE_SMOKE_CEILING_USD"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: eval-live
      - name: Run live eval suite
        env:
          CROM_EVAL_LIVE: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=(--suite "$SUITE" --provider "$PROVIDER" --allow-failures
                --max-run-cost-usd "$MAX_RUN_COST_USD")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          set +e
          cargo run --locked -p crom-cli -- eval run "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning::all tasks skipped (missing the $PROVIDER API-key secret, unpriced model, or spend cap reached)"
            exit 0
          fi
          exit "$rc"
      - name: Scoreboard
        if: always()
        run: |
          cargo run --locked -p crom-cli -- eval scoreboard --format md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-live-runs
          # Archived workspaces keep their sources; their cargo build output
          # was ~98% of a 15 GiB benchmark artifact.
          path: |
            target/crom-eval/runs
            !target/crom-eval/runs/**/workspace/target/**
          if-no-files-found: ignore
