[package]
name = "crom-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authorization, credential isolation, and audit for agent-initiated operations (Crom Guard)."
publish = false

# Must never depend on another crom-* crate (ADR 0002; checked by
# scripts/check-guard-deps.sh in CI).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = "2.6"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
futures = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# Validates the published audit schema in tests only.
jsonschema = { version = "0.61", default-features = false }
