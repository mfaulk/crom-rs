[package]
name = "crom-guard-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Controlled business API, synthetic tenants, and effect ledger for testing Crom Guard."
publish = false

[dependencies]
# For support_ops and scenario only; the HTTP API and ledger do not use it.
crom-guard = { path = "../crom-guard" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net"] }
reqwest = { workspace = true }
# Scenario environments keep credentials and audit logs in a temp dir.
tempfile = { workspace = true }

[dev-dependencies]
# The crom-guard-support example binary (support_ops behind the server CLI)
# and the server lanes of tests/guard_adversarial.rs.
# crom-guard-server must not depend on this crate (scripts/check-guard-deps.sh).
crom-guard-server = { path = "../crom-guard-server" }
jsonschema = { version = "0.61", default-features = false }
# Canary test: captures every trace event.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "crom-guard-support"
path = "examples/crom-guard-support.rs"
