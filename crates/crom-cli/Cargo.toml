[package]
name = "crom-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "crom command-line interface"

[[bin]]
name = "crom"
path = "src/main.rs"

[dependencies]
crom-core = { workspace = true }
crom-anthropic = { workspace = true }
crom-sdk = { workspace = true, features = ["anthropic", "fake-provider"] }
crom-eval = { workspace = true }
crom-tools = { workspace = true }
crom-session = { workspace = true }
crom-checkpoint = { workspace = true }
crom-mcp = { workspace = true }
crom-auth = { workspace = true }
crom-provider-openai = { workspace = true }
crom-provider-gemini = { workspace = true }
crom-tui = { path = "../crom-tui", version = "0.1.0" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
rpassword = "7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
temp-env = { workspace = true }
