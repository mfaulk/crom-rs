# Nominal list prices for cost estimation. Compiled into crom-core via
# `include_str!` and parsed at runtime; no prices live in Rust source.
#
# Costs computed from this table are NOMINAL: published standard-tier list
# price x reported token usage. They are not billed amounts (no discounts,
# credits, batch/flex/off-peak rates, regional surcharges, or cache storage
# fees). See docs/providers.md#cost-semantics.
#
# Units: USD per 1,000,000 tokens. Field meanings follow crom's normalized
# `TokenUsage` (crates/crom-core/src/usage.rs):
#   input        regular (uncached) input tokens
#   output       output tokens, including reasoning/thinking tokens
#   cache_write  cache-creation input tokens (omit if the provider has no
#                separate write price)
#   cache_read   cache-hit input tokens (omit if not applicable)
# When a cache price is set and the provider leaves that token count
# unreported, the cost is unknown (never zero).
#
# Matching: `provider` is the provider profile id (docs/providers.md);
# `model` and `aliases` match the request model id exactly.
#
# Models with prompt-size price tiers (e.g. gemini-2.5-pro above 200k
# prompt tokens) are deliberately omitted: a flat rate would misprice them,
# so their cost stays unknown with reason `no_pricing_entry`.
#
# Update procedure: docs/providers.md#updating-the-pricing-table. In short:
# re-read each `source_url`, edit prices, set `retrieved_at` on every
# changed entry, bump top-level `version` to the retrieval date, and run
# `cargo test -p crom-core pricing`.

version = "2026-11-15"
currency = "USD"

# --- Anthropic (5-minute cache-write rate; 1-hour writes cost more) ---

[[models]]
provider = "anthropic"
model = "claude-sonnet-4-6"
input = 3.00
output = 15.00
cache_write = 3.75
cache_read = 0.30
source_url = "https://platform.claude.com/docs/en/about-claude/pricing"
retrieved_at = "2026-11-15"

[[models]]
provider = "anthropic"
model = "claude-opus-5-5"
input = 4.00
output = 20.00
cache_write = 5.00
cache_read = 0.20
source_url = "https://platform.claude.com/docs/en/about-claude/pricing"
retrieved_at = "2026-11-15"

