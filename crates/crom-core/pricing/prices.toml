# --- DeepSeek (peak-hour rates; off-peak is 50%, so nominal is an upper
# bound). `input` = cache miss, `cache_read` = cache hit. The page no longer
# lists `deepseek-chat` / `deepseek-reasoner`, so they are not priced. ---

[[models]]
provider = "deepseek"
model = "deepseek-flash"
aliases = ["deepseek-v4-flash"]
input = 0.30
output = 1.20
cache_read = 0.006
source_url = "https://api-docs.deepseek.com/quick_start/pricing"
