schema_version = 2
id = "rust-serde-edge-case"
title = "Fix a JSON deserialization edge case"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "serde", "json", "small"]
suites = ["rust-small", "rust-mini"]

prompt = """
Config parsing breaks when the optional `retries` field is missing from the
JSON. It should default to 3 instead of failing. Fix the deserialization and
keep the existing tests passing.
"""

max_turns = 20
timeout_secs = 300

[capabilities]
requires_repo_search = true
requires_test_feedback = true

[fixture]
kind = "copy_dir"
path = "repo"

[oracle]
kind = "command"
commands = ["cargo test --all-targets"]

[[oracle.assertions]]
kind = "file_contains"
path = "src/lib.rs"
text = "default"

[[oracle.behavior]]
kind = "must_run_command"
command_contains = "cargo test"
