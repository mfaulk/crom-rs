id = "l3-ron-integer-suffix-base"
title = "Parse octal and hex RON integers that carry a type suffix"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "hidden-tests", "bugfix", "parsing", "serde", "upstream", "l3"]
suites = ["l3"]

prompt = """
This is the `ron` crate (Rusty Object Notation). RON integer literals may be
written in binary (`0b`), octal (`0o`) or hexadecimal (`0x`) and may carry
an explicit type suffix such as `i32` or `u8`. Octal and hexadecimal
literals stop parsing as soon as a suffix is added:

```rust
assert_eq!(ron::from_str::<i64>("0x2A"), Ok(42));           // works
assert_eq!(ron::from_str::<u32>("0x2Au32"), Ok(42));        // Err(TrailingCharacters)
assert_eq!(ron::from_str::<i32>("-0x2Ai32"), Ok(-42));      // Err(TrailingCharacters)
assert_eq!(ron::from_str::<u32>("0o52u32"), Ok(42));        // Err(TrailingCharacters)
```

The same inputs also fail when deserialized into `ron::Value`.

Expected: a suffixed integer literal is accepted in every supported base
(binary, octal, decimal, hexadecimal), with or without a leading `-`, and
produces the same value as the unsuffixed literal (and, for `ron::Value`,
the number type named by the suffix). Decimal and unsuffixed literals must
keep working as today.

Keep the public API unchanged and keep `cargo test` green.
"""

