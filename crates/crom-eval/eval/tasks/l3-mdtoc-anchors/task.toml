schema_version = 3
task_version = "1.0.0"
kind = "capability"
level = "L3"
network = "none"
reference = "oracle_patch"
oracle_patch = "oracle.patch"
id = "l3-mdtoc-anchors"
title = "Generate GitHub-compatible, unique TOC anchors in mdtoc"
category = "bugfix"
difficulty = "hard"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "unicode", "l3"]
suites = ["l3"]

prompt = """
Links in tables of contents generated by the `mdtoc` workspace (`mdscan`,
`slugger`, `toc`) often don't work on GitHub. Make the generated anchors match
GitHub's heading anchors:

1. Slugs (`slugger::slug`): lowercase the text (Unicode-aware), keep every
   alphanumeric character (`char::is_alphanumeric`) plus `_` and `-`, turn
   each space into `-`, and drop every other character. Do not collapse or
   trim dashes. `"C++ & Rust"` -> `"c--rust"`, `"Über Straße"` ->
   `"über-straße"`.
2. Duplicate anchors: when a heading's slug is already taken, append `-1`,
   `-2`, ... using the smallest suffix that yields an unused anchor; the
   resulting anchor is then taken too. Anchors are assigned over every
   heading in the document in order, including headings that the level
   filter in `toc::entries` leaves out.
3. Lines inside fenced code blocks (opened by a line of three or more
   backticks or tildes, indented at most three spaces, and closed by a line
   of the same character at least as long) are not headings.

Keep the public API unchanged and `cargo test --workspace` green.
"""

timeout_secs = 300

forbidden_paths = ["Cargo.toml"]

[limits]
wall_secs = 900
max_turns = 40

[capabilities]
