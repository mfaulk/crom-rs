id = "l3-nom-multispace-eof"
title = "Fix the remaining input returned by complete &str parsers that consume everything"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "parsing", "upstream", "l3"]
suites = ["l3"]

prompt = """
This is the `nom` parser-combinator workspace (`nom`, `nom-language`,
`benchmarks`). On `&str` input, `recognize` and `consumed` report the wrong
slice when the inner parser is a complete-mode "zero or more" parser that
consumes the whole input.

Reproduce:

```rust
use nom::Parser;
use nom::character::complete::multispace0;
use nom::combinator::recognize;

let r = recognize::<_, nom::error::Error<&str>, _>(multispace0).parse("\\n");
// actual:   Ok(("", ""))
// expected: Ok(("", "\\n"))
```

`multispace0` itself returns the right output (`"\\n"`), but the remaining
input it hands back is an empty slice positioned at the *start* of the input
instead of at its end, so anything that derives the consumed part from the
remaining input's position (`recognize`, `consumed`, offset arithmetic)
sees nothing consumed. The same parsers on `&[u8]` input behave correctly.
The other `character::complete` "zero or more" parsers (for example
`alpha0`, `digit0`, `space0`) share the same `&str` input handling and are
affected whenever no character stops them.

When such a parser consumes all of a `&str` input, the remaining input must
be the empty slice at the end of the original input. Keep the public API
unchanged and the existing test suite green.
"""

