oracle_patch = "oracle.patch"
id = "l3-csv-quoting"
title = "Implement RFC 4180 quoting in the tabular CSV reader"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "parsing", "l3"]
suites = ["l3-mini"]

prompt = """
The `tabular` workspace (`csvread`, `schema`, `colstats`) mangles real-world
CSV exports. Column summaries come out wrong or `schema::load` reports ragged
rows as soon as a file contains quoted fields with commas, escaped quotes,
line breaks inside quotes, or Windows (CRLF) line endings.

Rewrite `csvread::parse` to follow RFC 4180:

- Fields are separated by `,`; records end at `\\n` or `\\r\\n`.
- A field that starts with `"` is quoted: it may contain `,`, `\\r`, `\\n`,
  and `""` (an escaped `"`), and ends at the next lone `"`. The surrounding
  quotes are not part of the value. Unquoted fields are taken verbatim (no
  trimming).
- Completely empty lines between records are skipped, as today.
- A quoted field still open at end of input is
  `CsvError::UnterminatedQuote { line }`, where `line` is the 1-based physical
  line on which that field started. Any character after a closing quote other
  than `,` or a record end is `CsvError::UnexpectedChar { line, ch }`, with
  `line` the physical line of that character.

`csvread::write` output must parse back to the same records. Keep the public
API unchanged and `cargo test --workspace` green.
"""

