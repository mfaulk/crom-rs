oracle_patch = "oracle.patch"
id = "l3-logstore-reopen"
title = "Fix data loss when reopening a log-structured store with large values"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "debugging", "l3"]
suites = ["l3-mini"]

prompt = """
Bug report against the `logkv` workspace (`wire`, `logstore`, `kvtool`):

> Everything works while the process is running, but after I reopen a store
> from its log with `Store::open`, it fails with "corrupt log" — or worse,
> returns different values — whenever I stored a value longer than about a
> hundred bytes. Short values are fine. `compact()` followed by reopening has
> the same problem.

Find the root cause and fix it so that any log produced by this workspace
can be reopened losslessly, regardless of key or value size. Do not change
the on-disk format that is already written correctly, and keep the public API
and the existing test suite (`cargo test --workspace`) passing.
"""

timeout_secs = 300

forbidden_paths = ["Cargo.toml"]

