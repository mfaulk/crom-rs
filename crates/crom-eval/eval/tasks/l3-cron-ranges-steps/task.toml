kind = "capability"
level = "L3"
network = "none"
reference = "oracle_patch"
oracle_patch = "oracle.patch"
id = "l3-cron-ranges-steps"
title = "Add range and step syntax to the cronlite expression parser"
category = "feature"
difficulty = "medium"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "feature", "parsing", "l3"]
suites = ["l3-mini"]

prompt = """
The `cronlite` workspace (`calendar`, `cronexpr`, `scheduler`) only accepts
`*`, single numbers, and comma lists in cron fields. Users need the standard
range and step forms. Implement them so that each comma-separated item of a
field may be any of:

- `*` — every value in the field's bounds
- `N` — a single value
- `A-B` — every value from A to B inclusive
- `*/S` — every S-th value starting at the field's lower bound
- `A-B/S` — every S-th value from A up to at most B

Examples: `*/15` in the minute field is {0, 15, 30, 45}; `9-17/2` in the hour
field is {9, 11, 13, 15, 17}; `5-10,30` is {5, 6, 7, 8, 9, 10, 30}.

Errors: a value outside the field's bounds (including a range endpoint) is
`CronError::OutOfRange { field, value }`; a step of 0, a range whose start is
greater than its end, or any other malformed item is
`CronError::Invalid { field, token }`. Day-of-month/day-of-week "star"
semantics should stay exactly as they are for a field written as `*`.

`scheduler::next_run` / `upcoming` must work with the new syntax. Update the
workspace README's syntax note, keep the public API unchanged, and keep
`cargo test --workspace` green.
"""

