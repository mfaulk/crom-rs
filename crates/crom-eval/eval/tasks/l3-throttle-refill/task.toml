id = "l3-throttle-refill"
title = "Fix token-bucket refill drift and Retry-After hints in the throttle gateway"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "time", "l3"]
suites = ["l3"]

prompt = """
Operators of the `throttle` gateway (`clock`, `bucket`, `gateway`) report two
problems:

1. Clients that poll steadily get far fewer requests through than the
   configured rate. With a 100 ms interval and a capacity of 2, a client
   polling every 60 ms only gets a request through every 120 ms instead of
   every 100 ms on average.
2. When a client is limited, the `Retry-After` hint is always the full
   interval, even when the next token is only a few milliseconds away.

Fix the workspace so that a bucket gains one token per `interval_ms` of
elapsed time measured continuously: partial progress toward the next token
is never lost between calls, a bucket never holds more than `capacity`
tokens, and time spent while the bucket is full does not bank extra
progress. A denied request reports `retry_after_ms` as the exact number of
milliseconds until the next token becomes available. The gateway's
decisions must reflect this.

Keep public signatures unchanged and `cargo test --workspace` green.
"""

