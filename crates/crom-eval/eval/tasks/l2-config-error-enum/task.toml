id = "l2-config-error-enum"
title = "Replace stringly-typed errors with a ConfigError enum"
category = "refactor"
difficulty = "medium"
tags = ["rust", "multi-file", "hidden-tests", "refactor", "error-handling"]
suites = ["l2"]

prompt = """
Every fallible function in the `iniconf` crate returns `Result<_, String>`.
Redesign the error handling around a typed error:

- Add `pub enum ConfigError` in a new module `src/error.rs`, re-exported from
  the crate root, deriving `Debug, Clone, PartialEq, Eq`, with exactly these
  variants:
  - `Syntax { line: usize, msg: String }` for parse errors (1-based line; `msg`
    is the existing message text without the `line N: ` prefix),
  - `Missing { key: String }`,
  - `Invalid { key: String, value: String, expected: &'static str }` where
    `expected` is the target type name (`"u16"` or `"bool"`).
- Implement `Display` so `to_string()` yields exactly the messages the crate
  produces today, and implement `std::error::Error`.
- Change `parse`, `Config::require`, `Config::get_u16`, `Config::get_bool`,
  `Config::get_u16_or`, `ServerSettings::from_config`, and
  `ServerSettings::load` to return `Result<_, ConfigError>`.

`cargo test` must keep passing.
"""

max_turns = 30
timeout_secs = 600

forbidden_paths = ["Cargo.toml"]
required_paths = ["src/error.rs", "src/parse.rs", "src/typed.rs", "src/settings.rs"]

