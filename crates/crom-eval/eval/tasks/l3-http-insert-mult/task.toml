id = "l3-http-insert-mult"
title = "Fix HeaderMap corruption when replacing a header that has 3+ values"
category = "bugfix"
difficulty = "hard"
tags = ["rust", "hidden-tests", "bugfix", "data-structures", "upstream", "l3"]
suites = ["l3"]

prompt = """
This is the `http` crate. Replacing every value of a header through the entry
API breaks the `HeaderMap` when the header has three or more values:

    use http::header::{Entry, HeaderMap};

    let mut headers = HeaderMap::new();
    for v in ["a", "b", "c", "d"] {
        headers.append("hello", v.parse().unwrap());
    }
    headers.append("other", "x".parse().unwrap());
    headers.append("other", "y".parse().unwrap());

    if let Entry::Occupied(mut e) = headers.entry("hello") {
        let old: Vec<_> = e.insert_mult("new".parse().unwrap()).collect();
    }

In a debug build (e.g. under `cargo test`) this panics with an internal
assertion about the map's extra-value links instead of returning the old
values. With one or two values it works.

Expected behavior: `OccupiedEntry::insert_mult` returns all previous values in
insertion order (`["a", "b", "c", "d"]` above), after which `hello` has
exactly the single new value, other headers (`other` = `["x", "y"]`) are
untouched, `len()` reflects the change (3 above), and appending to `hello`
again works normally. `HeaderMap::insert` and the other entry methods must
keep their current behavior.

Keep the public API unchanged and keep the existing test suite green.
"""

