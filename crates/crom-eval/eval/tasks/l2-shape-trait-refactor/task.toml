id = "l2-shape-trait-refactor"
title = "Refactor the Shape trait and update every implementor and call site"
category = "refactor"
difficulty = "medium"
tags = ["rust", "multi-file", "hidden-tests", "refactor", "trait"]
suites = ["l2"]

prompt = """
Refactor the `Shape` trait in the `shapes` crate:

1. `fn name(&self)` must return `&'static str` instead of an allocated
   `String`.
2. Add a required method `fn perimeter(&self) -> f64` and implement it for
   every shape (`Circle`, `Rect`, `Square`, `Triangle`).
3. Add a provided (default) method `fn describe(&self) -> String` returning
   `<name>: area=<area> perimeter=<perimeter>`, both numbers with two decimals,
   e.g. `rect: area=6.00 perimeter=10.00`.

Then update `Scene`: add `total_perimeter(&self) -> f64`, make `largest()`
return `Option<&'static str>`, and make `Scene::describe()` emit one
`Shape::describe()` line per shape (each terminated by `\\n`). Update existing
call sites so `cargo test` passes.
"""

max_turns = 30
timeout_secs = 600

forbidden_paths = ["Cargo.toml"]
required_paths = ["src/shape.rs", "src/scene.rs"]

