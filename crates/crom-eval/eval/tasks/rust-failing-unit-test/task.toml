schema_version = 3
task_version = "1.0.0"
kind = "capability"
level = "L1"
network = "none"
id = "rust-failing-unit-test"
title = "Fix a small logic bug exposed by a failing test"
category = "bugfix"
difficulty = "easy"
tags = ["rust", "bugfix", "tests", "small"]
suites = ["rust-small", "rust-mini"]

prompt = """
A unit test is failing. Find and fix the logic bug so the tests pass. Do not
weaken or delete the test.
"""

max_turns = 20
timeout_secs = 240

[capabilities]
requires_repo_search = true
requires_test_feedback = true

[fixture]
kind = "copy_dir"
path = "repo"

[oracle]
kind = "rust"
test = true

[[oracle.behavior]]
kind = "must_use_tool"
tool = "Read"

[[oracle.behavior]]
kind = "must_run_command"
command_contains = "cargo test"

[provenance]
author = "crom maintainers"
source = "original"
license = "Apache-2.0 OR MIT"
created = "2026-06-03"
