id = "l3-layercfg-merge"
title = "Deep-merge config layers and fix environment overrides in layercfg"
category = "bugfix"
difficulty = "hard"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "config", "l3"]
suites = ["l3-mini"]

prompt = """
The `layercfg` workspace (`confval`, `layers`, `appconfig`) loads the
service configuration from defaults, an optional file, and environment
variables. Two classes of bug keep biting deployments:

1. A config file that overrides a single key in a section, e.g. only
   `[server]` / `port = 9000`, makes `AppConfig::load` fail with a missing
   `server.host`: the file's section replaces the whole default section.
2. Environment overrides don't work: `APP_SERVER__PORT=9001` is rejected or
   ignored, `APP_SERVER__READ_TIMEOUT=5` doesn't reach `server.read_timeout`,
   and `APP_FEATURES__METRICS=false` is not treated as a boolean.

Fix it so that:

- Merging layers is a deep merge: when both sides hold a table at the same
  key, their entries are merged recursively; otherwise the later layer's
  value replaces the earlier one.
- For variables starting with `APP_`, the rest of the name is split on `__`
  into path segments, each lowercased (a single `_` stays part of the key),
  so `APP_DB__POOL__MAX` sets `db.pool.max`. Values are interpreted the same
  way as scalar values in config files.
- Precedence stays defaults < file < environment.

Keep public signatures unchanged and `cargo test --workspace` green.
"""

