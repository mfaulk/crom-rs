id = "l3-url-path-caret"
title = "Percent-encode the caret in URL paths per the WHATWG URL Standard"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "parsing", "upstream", "l3"]
suites = ["l3"]

prompt = """
This is the `rust-url` workspace (`url`, `idna`, `percent-encoding`,
`form_urlencoded`, `data-url`). The `url` crate does not percent-encode the
caret (`^`, U+005E) in URL paths, so it disagrees with browsers and the WHATWG
URL Standard:

    let url = url::Url::parse("http://localhost/a^b").unwrap();
    assert_eq!(url.path(), "/a%5Eb"); // actually returns "/a^b"

The same happens for non-special schemes (`foo://host/^` keeps a raw `^`)
and when a path is assigned through the path / pathname setters, e.g. setting
the pathname of `a:/` to a string containing `^`.

Expected behavior: when parsing or setting a path, the `url` crate uses the
Standard's path percent-encode set, which is the query percent-encode set
(C0 controls, space, `"`, `#`, `<`, `>`) plus `?`, `^`, `` ` ``, `{` and `}`.
Characters already encoded today must stay encoded, userinfo encoding must not
change, and queries and fragments are unaffected.

The workspace's web-platform-tests runner keeps a list of known failures; if
your fix makes some of those cases pass, it will tell you so, and the list
should be updated accordingly. Keep the public API of every crate unchanged
and keep the existing test suite green.
"""

