Issue #960: DtdParser panics on chunked input with long unknown markup after `<`

Sibling of #957. The fix in #958 prevents the iterative growth of `skipped` inside `DtdParser::feed`'s `UndecidedMarkup` arm, but the same panic is still reachable via the *initial* assignment one arm earlier:

https://github.com/tafia/quick-xml/blob/master/src/parser/dtd.rs#L139

```rust
*self = Self::UndecidedMarkup(cur.len() - i - 1);
```

If a chunk delivers `<` followed by 9+ bytes of unknown markup (so `switch()` returns `None` on a window long enough to definitively rule out all keywords), `skipped` is set to that long value in one shot. On the next iteration, the very first line of the `UndecidedMarkup` arm panics:

```rust
bytes[..skipped].copy_from_slice(&buf[buf.len() - skipped..]);
// thread '...' panicked: range end index 24 out of range for slice of length 9
```

## Reproduction

```rust
use quick_xml::reader::Reader;
use std::io::BufReader;

let reader = BufReader::with_capacity(24, "<!DOCTYPE r[<aaaaaaaaaaaaaaaaaaaaaaaaaaaaa>]>".as_bytes());
let mut reader = Reader::from_reader(reader);
let mut buf = Vec::new();
let _ = reader.read_event_into(&mut buf); // panics
```

Surfaced by CIFuzz on #959 .

## Suggested fix

Mirror the bail-out already present in the `UndecidedMarkup` arm: when `cur.len() - i - 1 >= 9`, the markup is definitively unknown, so transition to `InElementDecl` (skip until `>`) instead of staging more bytes than the 9-byte work buffer can hold.

I'll send a PR with this fix and a regression test
"""

