prompt = """
This repository is the `glob` project (https://github.com/rust-lang/glob). Resolve the GitHub issue below. The issue text is reproduced as filed.

Keep the existing public API working, keep the existing test suite green, and do not edit `Cargo.toml`, `Cargo.lock`, `.cargo/`, or `vendor/`. There is no network access; build and test with `--offline`.

---

Issue #67: Using 'require_literal_leading_dot' matches folders that start with dot

Hey,

It seems like 'require_literal_leading_dot' option doesn't work as intended and matches files in directories that start with dot. For example if I would search for `*c*` file at `aaa/.bbb/ccc`, I would get a match even though the file is in hidden folder.

I've added some cases that fail main test at https://github.com/kitogo/glob fork.

Cheers,
Igor
"""

