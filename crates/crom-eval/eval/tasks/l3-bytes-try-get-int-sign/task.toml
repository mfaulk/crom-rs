id = "l3-bytes-try-get-int-sign"
title = "Sign-extend n-byte integers in the fallible Buf getters"
category = "bugfix"
difficulty = "easy"
tags = ["rust", "crate", "hidden-tests", "bugfix", "upstream", "l3"]
suites = ["l3"]

prompt = """
This is the `bytes` crate. The fallible signed n-byte getters on `Buf`
return wrong values for negative numbers when fewer than 8 bytes are read.

Reproduce:

```rust
use bytes::Buf;

let mut a = &[0xff, 0xff, 0xff][..];
assert_eq!(a.try_get_int(3), Ok(-1));   // actually returns Ok(16777215)

let mut b = &[0xff, 0xff, 0xff][..];
assert_eq!(b.get_int(3), -1);           // the panicking variant is correct
```

`try_get_int`, `try_get_int_le` and `try_get_int_ne` must return the same
value as `get_int`, `get_int_le` and `get_int_ne` respectively: the
`nbytes`-byte two's-complement value sign-extended to `i64`. Positive values,
full 8-byte reads, the `TryGetError` returned when not enough bytes remain,
and the panic when `nbytes > 8` must stay as they are.

Keep the public API unchanged and the existing test suite green.
"""

