id = "l3-toml-crlf-error-position"
title = "Fix wrong error line/column for CRLF input in the toml crate"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "workspace", "hidden-tests", "bugfix", "parsing", "upstream", "l3"]
suites = ["l3"]

prompt = """
This is the `toml` crate (with its `toml_test_suite` workspace member).
Error messages from `toml::from_str` report the wrong position when the
input uses Windows (CRLF, `\\r\\n`) line endings. Positions are correct for
the same document with plain `\\n` line endings.

Reproduce:

```rust
let lf   = "\\n[t1]\\n[t2]\\na = 1\\na = 2\\n";
let crlf = "\\r\\n[t1]\\r\\n[t2]\\r\\na = 1\\r\\na = 2\\r\\n";
let e1 = toml::from_str::<toml::Value>(lf).unwrap_err().to_string();
let e2 = toml::from_str::<toml::Value>(crlf).unwrap_err().to_string();
```

`e1` is "duplicate key: `a` for key `t2` at line 3 column 1", but `e2`
reports a different column for the same error (the error drifts further
the more CRLF lines precede it).

Expected: line and column numbers in error messages are the same whether
the document uses `\\n` or `\\r\\n` line endings (the `\\r` belongs to the
line terminator, not to the next line). For the example above both
messages must be "duplicate key: `a` for key `t2` at line 3 column 1".

Keep the public API unchanged and keep the existing test suite green
(`cargo test --workspace --lib --tests -- --skip float_inf` and the
`toml` doc tests).
"""

