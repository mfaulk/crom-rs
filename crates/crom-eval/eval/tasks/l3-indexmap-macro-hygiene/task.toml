id = "l3-indexmap-macro-hygiene"
title = "Stop indexmap!/indexset! macros from shadowing a caller's CAP constant"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "workspace", "multi-crate", "hidden-tests", "bugfix", "macros", "upstream", "l3"]
suites = ["l3"]

prompt = """
This is the `indexmap` crate (with its `test-nostd`, `test-serde` and
`test-sval` workspace members). The construction macros `indexmap!`,
`indexmap_with_default!`, `indexset!` and `indexset_with_default!` silently
produce the wrong contents when the caller has an item named `CAP` in scope.

Reproduce it from outside the crate:

```rust
const CAP: usize = 42;
let m = indexmap::indexmap! { "k" => CAP };
assert_eq!(m["k"], 42); // fails: the value stored is 1

let s = indexmap::indexset!(CAP);
assert_eq!(s[0], 42);   // fails: the element stored is 1
```

The same happens with `indexmap_with_default!(fnv::FnvHasher; ...)` and
`indexset_with_default!(fnv::FnvHasher; ...)`. A caller's local variable
named `map` (for the map macros) used as a key or value must also keep
referring to the caller's binding.

Expected: the macros must evaluate the caller's key/value/element
expressions exactly as written, regardless of which names the caller has in
scope, while still pre-sizing the collection for the number of entries.

Keep the public API (macro names and accepted syntax) unchanged and keep
`cargo test --workspace` green.
"""

