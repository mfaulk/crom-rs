`cargo test` fails in the `calc` crate (lexer -> parser -> evaluator), and the
failures spread across several modules. Find the root causes and fix them so
that every expression documented by the grammar in src/parser.rs evaluates
correctly. Do not change the public API, and do not weaken or delete any
existing test.
"""

