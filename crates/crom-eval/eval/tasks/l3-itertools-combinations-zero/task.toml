id = "l3-itertools-combinations-zero"
title = "Fix zero-length combinations in itertools"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "upstream", "hidden-tests", "bugfix", "iterators", "l3"]
suites = ["l3"]

prompt = """
This is the `itertools` crate. Asking for combinations of length 0 gives
the wrong answer in some cases:

```rust
use itertools::Itertools;
// expected: [[]]   (one empty combination)
let a: Vec<Vec<i32>> = (0..0).combinations(0).collect();                  // got: []
let b: Vec<Vec<i32>> = (0..3).combinations_with_replacement(0).collect(); // got: []
let c: Vec<Vec<i32>> = (0..0).combinations_with_replacement(0).collect(); // got: []
```

Mathematically there is exactly one combination of length 0 (the empty
one), whatever the pool is, including an empty pool. `(1..3).combinations(0)`
already returns `[[]]`, but the cases above return nothing.

Expected behavior: `combinations(0)` and `combinations_with_replacement(0)`
yield exactly one empty `Vec` and then end, for any source iterator,
including an empty one. `permutations(0)` should behave the same way.
Behavior for `k > 0` must not change, including for empty or too-short
pools.

`tests/test_std.rs` has an existing assertion that
`(0..3).combinations_with_replacement(0)` is empty. That assertion encodes
the bug, so update it to the correct expectation. Keep the public API
unchanged and keep `cargo test` green.
"""

