schema_version = 3
task_version = "1.1.0"
kind = "capability"
level = "L1"
network = "none"
reference = "oracle_patch"
id = "rust-refactor-preserve"
title = "Refactor duplicated code without changing behavior"
category = "refactor"
difficulty = "medium"
tags = ["rust", "single-file", "refactor", "hidden-tests", "small"]
suites = ["rust-small", "rust-mini", "l1"]

prompt = """
`area_of_circle` and `circumference` duplicate the same PI constant and radius
validation. Factor out the shared logic so there is a single source of truth.
Behavior must not change and `cargo test` must still pass. Keep the change
focused and minimal.
"""

max_turns = 20
timeout_secs = 240

forbidden_paths = ["Cargo.toml"]
required_paths = ["src/lib.rs"]
oracle_patch = "oracle.patch"

[capabilities]
requires_repo_search = true
requires_test_feedback = true
requires_public_api_preservation = true

# Advisory (not enforced): read before editing, run `cargo test` after.
[behavior]
require_read_before_write = true
require_validation_after_edit = true
penalize_test_deletion = true

[fixture]
kind = "copy_dir"
path = "repo"

# A correct refactor keeps tests green. The patch-quality dimension penalises
# broad rewrites for this 'small' task, rewarding a focused change.
[oracle]
kind = "command"
commands = ["cargo test --all-targets"]

# Hidden: behavior is unchanged across zero/fractional/large/negative radii,
# and src/lib.rs keeps at most one PI literal and one negative-radius check
# (the refactor goal; the unmodified fixture has two of each).
[hidden]
fixture = "hidden"

[hidden.oracle]
kind = "command"
commands = [
    "cargo test --test hidden",
    "sh hidden_checks/single_source_of_truth.sh",
]

[provenance]
author = "crom maintainers"
source = "original"
license = "Apache-2.0 OR MIT"
created = "2026-06-03"
