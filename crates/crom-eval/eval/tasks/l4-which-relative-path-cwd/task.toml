Issue #127: Resolve relative PATH entries against the cwd passed to which_in

## Motivation

`which_in` accepts a `cwd`, allowing callers to resolve a command for a target working directory without changing the current directory of the calling process.

However, ordinary relative PATH entries such as `tools`, `./tools`, and `../tools` are currently searched relative to the process cwd rather than the `cwd` passed to `which_in`.

This is observable whenever the process cwd and target command cwd differ, which is common in task runners, package managers, build tools, and monorepo tooling.

## Example

Given:

```text
process cwd: /repo
provided cwd: /repo/packages/app
PATH entry:  ./tools
binary name: fake-tool
```

I would expect:

```rust
which::which_in(
    "fake-tool",
    Some("./tools"),
    "/repo/packages/app",
)
```

to search:

```text
/repo/packages/app/tools/fake-tool
```

The current implementation instead effectively searches:

```text
/repo/tools/fake-tool
```

## Proposed behavior

When searching PATH entries, `which_in` should resolve ordinary relative entries against its provided `cwd` before appending the binary name.

I think this should happen internally using `PathBuf`s, without serializing normalized entries back into a PATH string. On Unix, the provided cwd may contain `:`, which cannot be represented as one entry in a serialized PATH value.

## Compatibility considerations

The change should apply only to ordinary relative PATH entries. Existing platform-specific behavior should be preserved, including:

- Unix empty PATH entries representing the current directory
- Windows ignoring empty PATH entries
- tilde-prefixed entries using the existing tilde-expansion behavior
- Windows drive-relative paths such as `C:tools`
- Windows root-relative paths such as `\\tools`
- absolute drive paths
- UNC paths

## Proposed tests

I would add tests covering:

- `tools`, `./tools`, and `../tools`
- process cwd different from the provided cwd
- provided Unix cwd containing `:`
- empty PATH entry behavior on Unix and Windows
- Windows drive-relative, root-relative, absolute, and UNC paths
- tilde-prefixed entries

Would this behavior be acceptable?

If so, I would be happy to submit a PR implementing it.
"""

