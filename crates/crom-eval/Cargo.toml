[package]
name = "crom-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Coding-agent capability evaluation harness for crom."

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
similar = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }

crom-core = { workspace = true }
crom-auth = { workspace = true }
crom-sdk = { workspace = true, features = [
    "fake-provider",
    "filesystem-workspace",
    "in-memory-workspace",
    "anthropic",
    "planning",
] }

# Optional live providers, mirrored from the SDK feature surface. Enabled by
# the `anthropic` feature is the default; the live provider lane is gated at
# runtime by the CROM_EVAL_LIVE env var, not at compile time.
crom-anthropic = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Used to SIGKILL the whole process group of an oracle command on timeout /
# output-cap so children (e.g. cargo) are not orphaned.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
