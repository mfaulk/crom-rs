[package]
name = "code-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "code-agent command-line interface"

[[bin]]
name = "code-agent"
path = "src/main.rs"

[dependencies]
code-agent-core = { workspace = true }
code-agent-anthropic = { workspace = true }
code-agent-sdk = { workspace = true, features = ["anthropic", "fake-provider"] }
code-agent-tools = { workspace = true }
code-agent-session = { workspace = true }
code-agent-checkpoint = { workspace = true }
code-agent-mcp = { workspace = true }
code-agent-auth = { workspace = true }
code-agent-provider-openai = { workspace = true }
code-agent-provider-gemini = { workspace = true }
code-agent-tui = { path = "../code-agent-tui", version = "0.1.0" }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
