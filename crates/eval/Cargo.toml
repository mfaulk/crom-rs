[package]
name = "code-agent-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Coding-agent capability evaluation harness for code-agent."

[dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
similar = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }

code-agent-core = { workspace = true }
code-agent-auth = { workspace = true }
code-agent-sdk = { workspace = true, features = [
    "fake-provider",
    "filesystem-workspace",
    "in-memory-workspace",
    "anthropic",
    "planning",
] }

# Optional live providers, mirrored from the SDK feature surface. Enabled by
# the `anthropic` feature is the default; the live provider lane is gated at
# runtime by the CODE_AGENT_EVAL_LIVE env var, not at compile time.
code-agent-anthropic = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
