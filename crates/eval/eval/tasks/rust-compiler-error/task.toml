schema_version = 2
id = "rust-compiler-error"
title = "Repair a broken build after an API change"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "compile", "small", "multi-file"]
suites = ["rust-small", "rust-mini"]

prompt = """
This crate does not compile: a struct field was renamed but a caller was not
updated. Make it build and pass tests without changing the test expectations.
"""

max_turns = 20
timeout_secs = 240

[capabilities]
requires_repo_search = true
requires_test_feedback = true
requires_multifile_edit = true

[fixture]
kind = "copy_dir"
path = "repo"

[oracle]
kind = "rust"
test = true

[[oracle.behavior]]
kind = "must_run_command"
command_contains = "cargo"
