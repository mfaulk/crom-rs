schema_version = 2
id = "rust-cli-arg-order"
title = "Fix a CLI arg-parsing edge case spanning multiple files"
category = "bugfix"
difficulty = "medium"
tags = ["rust", "cli", "bugfix", "small", "multi-file"]
suites = ["rust-small", "rust-mini"]

prompt = """
The CLI fails when --output is passed after the input path (e.g. `app in.txt
--output out.txt`). Fix the parser so flags may appear in any order. Do not
change the public CLI syntax. Tests describe the expected behavior.
"""

max_turns = 24
timeout_secs = 300

[capabilities]
requires_repo_search = true
requires_test_feedback = true
requires_multifile_edit = true
requires_cli_execution = true

[fixture]
kind = "copy_dir"
path = "repo"

[oracle]
kind = "command"
commands = ["cargo test --all-targets"]

[[oracle.behavior]]
kind = "must_use_tool"
tool = "Read"

[[oracle.behavior]]
kind = "must_run_command"
command_contains = "cargo test"
