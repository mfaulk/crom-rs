[package]
name = "code-agent-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI (M9) for code-agent: plain + fullscreen renderers, status line, composer, approvals, diffs."

[dependencies]
code-agent-core = { workspace = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
unicode-width = "0.2"
textwrap = "0.16"
similar = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
