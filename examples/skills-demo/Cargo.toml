[package]
name = "skills-demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dev-dependencies]
code-agent-core = { path = "../../crates/code-agent-core" }
code-agent-tools = { path = "../../crates/code-agent-tools" }
