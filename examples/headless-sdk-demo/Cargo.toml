[workspace]

[package]
name = "headless-sdk-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
futures = "0.3"
crom-sdk = { path = "../../crates/crom-sdk", features = ["fake-provider"] }
crom-core = { path = "../../crates/crom-core" }
serde_json = "1"
