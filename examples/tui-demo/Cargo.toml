[workspace]

[package]
name = "tui-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
crom-sdk = { path = "../../crates/crom-sdk", features = ["fake-provider"] }
crom-core = { path = "../../crates/crom-core" }
crom-tui = { path = "../../crates/crom-tui" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
