[workspace]

[package]
name = "tui-demo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
code-agent-sdk = { path = "../../crates/code-agent-sdk", features = ["fake-provider"] }
code-agent-core = { path = "../../crates/code-agent-core" }
code-agent-tui = { path = "../../crates/code-agent-tui" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
