# cargo-deny configuration for the code-agent workspace.
# Run locally with: cargo deny check
#
# The workspace publishes under `Apache-2.0 OR MIT`, so we allow the common
# permissive licenses that appear in our dependency tree. Copyleft and
# unknown licenses are rejected by default (anything not on the allow-list).

[graph]
# Check the dependency graph for all targets so a platform-specific dep
# can't smuggle in a disallowed license or advisory.
all-features = true

[advisories]
# Use the default RustSec advisory database. `version = 2` opts into the
# current behavior where unmaintained/yanked default to warn and only
# vulnerabilities fail unless escalated.
version = 2
yanked = "deny"
# Specific advisories to ignore go here, each with a justifying comment.
# (None currently — the tree is clean as of the last local `cargo deny check`.)
ignore = []

[licenses]
version = 2
# SPDX identifiers allowed in the dependency tree. Compatible with the
# workspace's own `Apache-2.0 OR MIT` publish license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    # Mozilla CA root certificate bundle shipped by `webpki-roots` (via rustls).
    # CDLA-Permissive-2.0 is a permissive data license; safe for redistribution.
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]
# Confidence threshold for fuzzy license-text matching (0.0 - 1.0).
confidence-threshold = 0.8
# Per-crate clarifications for crates whose license can't be detected
# automatically from their files.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Warn (not fail) on duplicate versions of the same crate — common and
# usually benign in a large async tree. Flip to "deny" if you want to
# force-dedup the lockfile.
multiple-versions = "warn"
wildcards = "allow"
# Highest-priority lint for the build graph ordering of features.
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# Only allow crates from the official registry and git sources we trust.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
